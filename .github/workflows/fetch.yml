name: fetch
on:
  push:
    paths: ['fetch.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: baixar
        run: |
          mkdir -p fetched
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL -o "fetched/$name" "$url"
          done < fetch.txt
      - name: salvar
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add fetched
          git commit -m "Arquivos baixados" || exit 0
          git push
